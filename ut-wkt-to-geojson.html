<script type="text/x-red" data-template-name="wkt-to-geojson">
	<div class="form-row">
		<label for="node-input-wkt">wkt</label>
		<textarea id="node-input-wkt" style="height: 250px; min-height:250px; width: 100%; max-width: none" autocomplete="off" placeholder="wkt"></textarea>
	</div>

</script>

<script type="text/x-red" data-help-name="wkt-to-geojson"">
    <p> Convert a WKT to GeoJson format</p>
	    
		<h3>Inputs</h3>
    A JSON with these parameters:

    <dl class="message-properties">
        <dt>wkt
            <span class="property-type">string</span>
        </dt>
        <dd>The wkt to be converted.</dd>
    </dl>
	
       <h3>Outputs</h3>
    <dl class="message-properties">
        <dd> GeoJson format result</dd>
    </dl>

    <h3>Details</h3>
    <p>The node can receive a JSON with the parameters described in the Inputs section and with them generate the output.
        If the values are not present in the input JSON, these are read by those in the configuration. If they are not present
        in either part, an error is generated for the necessary parameters.</p>

</script>
<script type="text/javascript">
    RED.nodes.registerType('wkt-to-geojson', {
        category: 'S4CUtility',
        color: '#E9967A',
        defaults: {
            name: {
                value: ""
            },
			wkt: {
                value: ""
            },
        },
        outputs: 1,
        inputs: 1,
        icon: "service-center.png",
        label: function () {
            return this.name || "wkt-to-geojson";
        }
    });
</script>
